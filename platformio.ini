[env:esp32-c6-devkitc-1]
; generate_version.py -- BARU, jalan SEBELUM tiap compile, generate
; include/version.h dari `git describe --tags` (lihat komentar
; lengkap di file script itu). Dipakai screen_settings.cpp untuk
; menampilkan versi firmware yang sedang berjalan.
extra_scripts = pre:generate_version.py

; Sama seperti firmware Tasmota+BLE -- pioarduino fork WAJIB untuk
; Arduino framework di ESP32-C6 (platform resmi belum support, lihat
; issue platformio/platform-espressif32 #1587/#1694/#1474).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; Firmware ini TIDAK PAKAI BLE sama sekali. WiFi TETAP DIPAKAI, tapi
; HANYA untuk OTA update firmware (lihat ota_manager.h/.cpp) --
; SAMA SEKALI TIDAK dipakai untuk kontrol motor/pembacaan berat.
; Flash usage tetap lebih kecil dari firmware Tasmota+BLE lama (yang
; pakai WiFi HTTP untuk kontrol + BLE untuk timbangan), partition
; default seharusnya cukup. Tetap pakai min_spiffs.csv untuk
; konsisten & headroom pengembangan (UI LVGL + WiFi OTA + relay
; kontrol GPIO, semuanya sudah aktif di firmware ini).
board_build.partitions = min_spiffs.csv

; bogde/HX711: library HX711 paling umum dipakai komunitas Arduino/
; PlatformIO -- API sederhana (begin/read/read_average), cukup untuk
; hx711_reader.h. TIDAK ADA NimBLE-Arduino di sini (beda dari firmware
; Tasmota+BLE) karena tidak ada BLE sama sekali di firmware ini.
;
; lvgl @ ^8.4.0 -- versi PERSIS yang dipakai contoh resmi Waveshare
; untuk board QSPI-AMOLED ini (lihat catatan versi di
; src/ui/lv_port.h/.cpp). JANGAN naikkan ke v9 tanpa migrasi API
; (lv_disp_draw_buf_t/lv_disp_drv_t/dkk berubah total di v9).
;
; moononournation/GFX Library for Arduino -- dipakai lv_port.cpp
; untuk driver Arduino_CO5300 (QSPI, cocok dengan Driver IC CO5300
; yang dikonfirmasi terpasang di board ini). DI-PIN ke @1.6.7.
;
; RIWAYAT KOREKSI VERSI (penting untuk siapa pun yang tergoda
; mengubah versi ini lagi tanpa compile aktual): draft awal sempat
; pin ke @1.3.7 berdasar referensi board LAIN (LilyGO
; T-Display-S3-AMOLED, chip CO5300 sama) TANPA verifikasi langsung --
; ternyata SALAH, v1.3.7 BELUM PUNYA kelas Arduino_CO5300 sama sekali
; (baru ditambahkan di v1.4.8). Verifikasi lanjutan (clone repo
; langsung, cek isi source): v1.4.8 punya Arduino_CO5300 tapi dengan
; signature constructor BERBEDA (ada parameter `bool ips` di posisi
; ke-4); signature TANPA `ips` (yang cocok dengan lv_port.cpp saat
; ini) baru stabil mulai v1.6.1. DI-PIN ke v1.6.7 (versi stabil
; terbaru saat verifikasi) -- signature-nya sudah dicocokkan langsung
; ke source DAN sudah diverifikasi lewat COMPILE AKTUAL berhasil
; (lihat catatan compile di README bagian "Status UI LVGL").
lib_deps =
    bogde/HX711 @ ^0.7.5
    lvgl/lvgl @ ^8.4.0
    moononournation/GFX Library for Arduino @ 1.6.7
    bblanchon/ArduinoJson @ ^7.0.4

monitor_speed = 115200
upload_speed = 921600
upload_port = COM6
monitor_port = COM6

; -DLV_CONF_INCLUDE_SIMPLE mengarahkan LVGL untuk mencari "lv_conf.h"
; di include path project (lihat include/lv_conf.h) alih-alih di root
; sketch/library folder -- pola umum untuk setup PlatformIO dengan
; lv_conf.h custom.
;
; -I include DITAMBAHKAN setelah COMPILE AKTUAL PERTAMA GAGAL dengan
; "fatal error: lv_conf.h: No such file or directory" -- PlatformIO
; TIDAK otomatis mengexpose folder include/ project ke library
; eksternal (lvgl ada di lib_deps, bukan folder src/lib project ini),
; jadi LV_CONF_INCLUDE_SIMPLE saja tidak cukup tanpa flag -I eksplisit
; ini. Ini bug konfigurasi nyata yang HANYA ketahuan lewat compile
; aktual -- JANGAN dihapus, walau kelihatan redundan dengan baris di
; atas.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; src/ui/ SEKARANG DIIKUTKAN ke build -- LVGL + driver AMOLED (lihat
; src/ui/lv_port.h/.cpp) + wiring GrindController<->g_ui_state di
; main.cpp SUDAH ditambahkan. Nomor pin QSPI/I2C touch SUDAH
; terverifikasi dari clone repo resmi vendor (lihat komentar lengkap
; di src/ui/lv_port.h). ✅ SELURUH CHAIN INI (pin + Arduino_GFX +
; LVGL + kode project) SUDAH DIVERIFIKASI LEWAT COMPILE AKTUAL
; BERHASIL (bukan lagi cuma review statis) -- lihat README bagian
; "Status UI LVGL" untuk detail bug yang ditemukan & diperbaiki lewat
; compile pertama ini (versi library, lv_conf.h, missing include,
; escape sequence UTF-8 salah, dst).
build_src_filter =
    +<*>

; ============================================================
; Environment [env:esp32-c6-devkitc-1-ota] (upload_protocol = espota)
; DIHAPUS -- keputusan eksplisit setelah diagnosa: espota.py
; mendorong firmware chunk-per-chunk (1024 byte) dengan
; acknowledgment round-trip tiap chunk, yang terbukti SANGAT lambat
; di jaringan hotspot HP (~2 detik per chunk, walau ping ke device
; normal ~20-100ms -- pola round-trip kecil itulah biang lambatnya,
; bukan link WiFi yang buruk). DIGANTIKAN oleh GitHub OTA (lihat
; github_ota.h/.cpp) -- device men-download firmware.bin dari GitHub
; Release lewat HTTPS (koneksi TCP tunggal mengalir penuh), dipicu
; manual lewat tombol di Settings, JAUH lebih cepat untuk kondisi
; jaringan yang sama. WiFi connection ke hotspot (OTA_WIFI_SSID di
; config.h) TETAP DIPERTAHANKAN -- GitHub OTA tetap butuh WiFi+
; internet, cuma protokol pengiriman firmware-nya yang beda total.
; Upload lewat USB (env:esp32-c6-devkitc-1 di atas) tetap jalur utama
; untuk development sehari-hari.

